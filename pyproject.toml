[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "repconv"
version = "0.1.0"
description = "Сходимость представлений нейросетей на примере рекомендательных систем"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Талменев Владимир Александрович" }]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pillow",
    "tqdm",
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate",
    "timm>=1.0",
    "datasets",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["repconv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
